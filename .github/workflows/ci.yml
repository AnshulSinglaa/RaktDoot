# Every push and pull request: lint, the full test suite against real PostGIS, a dependency audit,
# the frontend type-check + production build, and both Docker images. Nothing deploys from here yet.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read          # least privilege for the workflow token too

concurrency:              # a new push cancels the previous run of the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgis/postgis:16-3.4          # the same image as docker-compose.yml
        env:
          POSTGRES_USER: lifelink
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: lifelink_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifelink" --health-interval 3s --health-retries 20
    env:
      # CI is set by GitHub: conftest then FAILS (never skips) when the database is missing
      LIFELINK_TEST_DATABASE_URL: postgresql://lifelink:ci-only-password@127.0.0.1:5432/lifelink_test
      LIFELINK_DATABASE_URL: postgresql://lifelink:ci-only-password@127.0.0.1:5432/lifelink_test
      LIFELINK_JWT_SECRET: ci-only-secret-not-used-anywhere-else-000
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # do not leave the token in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Tests (real Postgres + PostGIS, coverage gate)
        run: python -m pytest -q --cov --cov-fail-under=85
      - name: Known-vulnerable dependencies
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # do not leave the token in .git/config
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # do not leave the token in .git/config
      - name: Build every image in docker-compose.yml
        env:                                   # compose refuses to start without these; building needs only placeholders
          POSTGRES_PASSWORD: ci
          APP_DB_PASSWORD: ci
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-000
        run: docker compose build
